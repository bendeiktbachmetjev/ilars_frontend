<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iLARS — store strip</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root {
    --paper: #F7F5FB;
    --ink: #2A1B55;      /* headline line 1 */
    --accent: #6A3FE0;   /* headline line 2 */
  }
  body { background: var(--paper); }

  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .16  0 0 0 0 .38  0 0 0 1.6 -.3'/></filter><rect width='360' height='360' filter='url(%23n)'/></svg>");
    background-size: 360px 360px;
    opacity: .05;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  /* ---------- headline ---------- */
  .hl {
    position: absolute; left: 0; right: 0;
    text-align: center;
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--ink);
    font-size: var(--hl, 120px);
  }
  .hl .l { display: block; white-space: nowrap; }
  .hl .l > span { display: inline-block; }
  .hl .l2 { color: var(--accent); }
  body.nohl .hl { visibility: hidden; }

  /* ---------- device ---------- */
  /* The device is rotated (frame and screen together) about its centre. The shadow sits on an
     unrotated wrapper, so it always falls straight down, whatever the tilt. Cool violet shadow,
     scaled with --dz (1 on the 1320-wide iPhone canvas). */
  .tilt { position: absolute; left: 0; top: 0; width: 0; height: 0;
    filter: drop-shadow(0 calc(70px * var(--dz)) calc(70px * var(--dz)) rgba(60, 40, 140, .18))
            drop-shadow(0 calc(10px * var(--dz)) calc(12px * var(--dz)) rgba(40, 28, 100, .20)); }
  .phone { transform-origin: 50% 50%; }

  /* drawn generic phone (Play): dark bezel, rounded screen, no camera, notch or buttons */
  .phone.drawn {
    background: #111114;
    box-shadow: inset 0 0 0 calc(2px * var(--dz)) #2A2A31;
  }
  .phone.drawn .dscreen { position: absolute; overflow: hidden; background: #fff; }
  .phone.drawn .dscreen img { position: absolute; left: 0; display: block; }

  /* devices carry z 1…9 among themselves; everything of the story lies above them */
  #story { position: absolute; left: 0; top: 0; z-index: 20; }
  .hl { z-index: 20; }
  #guide { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; }
</style>
<script src="../shared/people.js"></script>
<script src="../shared/pieces.js"></script>
<script src="../shared/glass.js"></script>
</head>
<body>
<script>ilarsPeople();</script>

<!-- ======= the wave: three soft bands across the whole strip (size set by the script) ======= -->
<svg id="arch" style="position:absolute; left:0; top:0">
  <defs>
    <filter id="paperShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow id="ps" dx="0" dy="12" stdDeviation="14" flood-color="#3C2A8C" flood-opacity=".14"/>
    </filter>
    <filter id="layerShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow id="ls" dx="0" dy="-6" stdDeviation="9" flood-color="#3C2A8C" flood-opacity=".10"/>
    </filter>
    <!-- outer to inner: lavender, orchid pink, soft orange (a gentle violet-to-orange sunset) -->
    <linearGradient id="gArA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3DBFF"/><stop offset="1" stop-color="#D8CDFF"/>
    </linearGradient>
    <linearGradient id="gArB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D7EA"/><stop offset="1" stop-color="#F0CBE3"/>
    </linearGradient>
    <linearGradient id="gArC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDDC2"/><stop offset="1" stop-color="#FFD2AF"/>
    </linearGradient>
  </defs>
  <path id="arA" fill="url(#gArA)" filter="url(#paperShadow)"/>
  <path id="arB" fill="url(#gArB)" filter="url(#layerShadow)"/>
  <path id="arC" fill="url(#gArC)" filter="url(#layerShadow)"/>
</svg>
<div class="grain"></div>

<div id="shots"></div>
<div id="story"></div>
<div id="headlines"></div>
<svg id="guide"></svg>

<script>
/* =====================================================================
   TEXT: one block per language. Pick it with ?lang=… (default en).
   Each language names its five captures and its five two-line headlines.
   Headlines are DRAFTS until the owner confirms them; change the strings here only.
   ===================================================================== */
const TEXT = {
  en: {
    screens: ['dashboard', 'daily', 'food', 'recommendations-diet', 'recommendations-exercise'],
    headlines: [
      ['Track your recovery', 'day by day'],
      ['A quick check-in', 'every day'],
      ['See how food', 'affects you'],
      ['Clear advice', 'on what to eat'],
      ['Gentle exercises', 'for every day'],
    ],
  },
  // lt: {
  //   screens: ['dashboard', 'daily', 'food', 'recommendations-diet', 'recommendations-exercise'],
  //   headlines: [['…', '…'], ['…', '…'], ['…', '…'], ['…', '…'], ['…', '…']],
  // },
};

/* =====================================================================
   What must stay whole inside its own screenshot, per capture, as [x1, y1, x2, y2] in capture
   pixels. Checked below; the result is in <body data-check>. The same list for every target:
   the phone captures are 1320 × 2868 (raw/<lang>), the iPad captures 2064 × 2752 (raw/ipad/<lang>).
   ===================================================================== */
const KEEP = {
  phone: {
    'dashboard':                [[460, 690, 860, 745], [60, 765, 1185, 1400], [100, 2175, 1220, 2268]],  // legend, chart, Fill It Now
    'daily':                    [[60, 660, 1262, 1332]],                                                  // first four answer cards
    'food':                     [[270, 425, 1050, 480], [48, 531, 1271, 1497]],                           // question, first two cards
    'recommendations-diet':     [[50, 375, 1265, 470], [50, 1170, 1265, 2018]],                           // tabs, first two tips
    'recommendations-exercise': [[50, 375, 1265, 470], [50, 545, 1265, 1225], [50, 1750, 1265, 2232]],    // tabs, goals, walking figure
  },
  ipad: {
    'dashboard':                [[900, 375, 1165, 425], [60, 430, 1975, 890], [70, 1335, 1995, 1445]],
    'daily':                    [[40, 335, 2024, 1125]],
    'food':                     [[800, 205, 1270, 250], [30, 285, 2035, 885]],
    'recommendations-diet':     [[30, 190, 2035, 270], [30, 745, 2035, 1090]],
    'recommendations-exercise': [[30, 190, 2035, 270], [30, 300, 2035, 635], [30, 960, 2035, 1300]],
  },
};

/* =====================================================================
   CONFIGS: everything that depends on the output size, one per target.
   The page draws CONFIGS[?target=…] (default ios).

   gap: the space a store leaves between two screenshots, in pixels of one screenshot's own scale.
   The canvas lays the screenshots out with this gap between them (screenshot i starts at
   x = i × (shotW + gap)) and draws everything that runs through (paper, wave, devices, shadows)
   right across it; render.sh throws the gap strips away. Shown with this gap, a device edge that
   crosses a seam continues on one straight line. Measured values (as for Dr. Filler):
     App Store  5.5 % of the width (product page ~4.2 %, search ~7–8 %): ios 72, ipad 114
     Google Play 13.5 % (~13.9 % in the app, ~10 % on the web): play 146
   Story x positions are written as (shot index × shotW + x inside that shot); the script adds
   the gaps itself.

   A device either crosses into the next screenshot with a real piece (a corner with some screen,
   ~15 % of its width or more), or runs off the edge of its own screenshot and ends inside the
   gap ("runs off": nothing of it shows in the neighbour). No slivers.
   ===================================================================== */
const CONFIGS = {};
CONFIGS.ios = {
  shotW: 1320, shotH: 2868,
  gap: 72,
  // Device: width (of the frame picture), tilt (deg, + = clockwise), centre in the shot's own
  // pixels, z = which lies on top.
  shots: [
    { pos: 'low',  w: 1080, angle:  10, cx:  847, cy: 1800, z: 2 },   // crosses into 2 (14 % of its width)
    { pos: 'high', w:  980, angle:  -9, cx:  925, cy: 1180, z: 4 },   // crosses into 3 (15 %)
    { pos: 'low',  w: 1040, angle:  11, cx:  690, cy: 1800, z: 3 },   // runs off (the food cards reach the seam)
    { pos: 'high', w:  950, angle: -14, cx:  842, cy: 1180, z: 7 },   // crosses into 5 (13 %)
    { pos: 'low',  w:  940, angle:   7, cx:  670, cy: 1810, z: 6 },
  ],
  frame: { src: '../shared/frame.png', w: 1470, h: 3000, sx: 75, sy: 66, sw: 1320, sh: 2868, r: 190,   // Apple's iPhone frame
           body: { w: 1412, h: 2959, r: 235 },          // the opaque body inside the picture (centred) and its corner radius
           statusbar: '../shared/statusbar.png' },      // a real iPhone status bar
  captures: '', keep: 'phone',
  headline: { col: 1160, max: 200, min: 40, top: 180, bottom: 2420 },
  k: 1,
  glass: true,                                           // Liquid Glass on pieces, rims, wave, beads (false = paper)
  wave: { edges: { top: [1560, 420], b1: [1960, 800], b2: [2380, 1200], bot: [3120, 1800] }, step: 20, bleed: 40 },
  story: [
    //   ['medal', who, centreX, centreY, diameter, mirrored]
    //   ['piece', kind, x, y, width, rot, extra]
    ['piece', 'progress', 40, 590, 420, -4],                       // 1
    ['medal', 'pat', 195, 2530, 330],                              // 1
    ['piece', 'check', 1320 + 60, 1600, 360, 5],                   // 2
    ['piece', 'food', 2640 + 40, 620, 175, -7, 'leaf'],            // 3
    ['piece', 'food', 2640 + 215, 735, 160, 6, 'loaf'],            // 3
    ['piece', 'food', 2640 + 60, 880, 160, -3, 'cup'],             // 3
    ['medal', 'doc', 3960 + 225, 1680, 300],                       // 4
    ['piece', 'steps', 5280 + 40, 560, 330, -4],                   // 5
    ['medal', 'pat', 5280 + 1120, 2470, 300],                      // 5
  ],
  // clear glass beads along the wave (glass only): [x, y, diameter]; at most two per screenshot,
  // never on a seam, near a headline or on a screen
  beads: [[1320 + 120, 1240, 58], [1320 + 200, 1330, 30], [3960 + 115, 1260, 54], [5280 + 120, 1720, 44]],
};

/* Google Play: 1080 × 1920, a drawn generic phone (Apple's frame is for Apple platforms only),
   captures shown from y = 186 so the empty status-bar zone is cut off. The gap is so wide that a
   crossing corner would only show as a sliver: every phone runs off its own screenshot instead. */
CONFIGS.play = {
  shotW: 1080, shotH: 1920,
  gap: 146,
  shots: [
    { pos: 'low',  w: 760, angle:   9, cx: 706, cy: 1215, z: 2 },   // each runs off into the gap
    { pos: 'high', w: 700, angle:  -6, cx: 770, cy:  800, z: 4 },
    { pos: 'low',  w: 740, angle:  11, cx: 650, cy: 1215, z: 3 },
    { pos: 'high', w: 680, angle: -10, cx: 735, cy:  800, z: 5 },
    { pos: 'low',  w: 680, angle:   7, cx: 545, cy: 1225, z: 6 },
  ],
  frame: { drawn: true, bezel: 15, radius: 58, cropTop: 186, capW: 1320, capH: 2868 },
  captures: '', keep: 'phone',
  headline: { col: 950, max: 200, min: 30, top: 95, bottom: 1600 },
  k: 0.763,
  glass: true,
  wave: { edges: { top: [956, 186], b1: [1261, 476], b2: [1582, 781], bot: [2146, 1239] }, step: 20, bleed: 40 },
  story: [
    ['piece', 'progress', 30, 420, 300, -4],
    ['medal', 'pat', 150, 1600, 240],
    ['piece', 'check', 1080 + 50, 1060, 250, 5],
    ['piece', 'food', 2160 + 30, 430, 115, -7, 'leaf'],
    ['piece', 'food', 2160 + 150, 505, 105, 5, 'loaf'],
    ['piece', 'food', 2160 + 45, 610, 105, -2, 'cup'],
    ['medal', 'doc', 3240 + 180, 1120, 210],
    ['piece', 'steps', 4320 + 30, 400, 250, -4],
    ['medal', 'pat', 4320 + 915, 1650, 230],
  ],
  beads: [[1080 + 92, 946, 44], [1080 + 153, 1015, 23], [3240 + 88, 961, 41], [4320 + 92, 1312, 34]],
};

/* iPad (App Store, 13"): 2064 × 2752, Apple's iPad Pro 13" frame and a real iPad status bar.
   The iPad is large and calm: small tilts, no two alike, slightly different sizes. */
CONFIGS.ipad = {
  shotW: 2064, shotH: 2752,
  gap: 114,
  shots: [
    { pos: 'low',  w: 1760, angle:  5, cx: 1192, cy: 1900, z: 2 },   // runs off right (into the gap) and bottom
    { pos: 'high', w: 1600, angle: -4, cx:  820, cy: 1140, z: 4 },   // runs off left (into the gap)
    { pos: 'low',  w: 1720, angle:  6, cx: 1188, cy: 1780, z: 3 },   // runs off right and bottom
    { pos: 'high', w: 1560, angle: -3, cx:  790, cy: 1110, z: 5 },   // runs off left
    { pos: 'low',  w: 1700, angle:  7, cx: 1080, cy: 1790, z: 6 },   // runs off bottom
  ],
  frame: { src: '../shared/frame-ipad.png', w: 2300, h: 3000, sx: 118, sy: 124, sw: 2064, sh: 2752,
           r: 60,                                   // the opening's corner is ~62 px; the screen sits just inside it
           body: { w: 2244, h: 2932, r: 150 },
           statusbar: '../shared/statusbar-ipad.png' },
  captures: 'ipad/', keep: 'ipad',
  headline: { col: 1800, max: 150, min: 40, top: 150, bottom: 2300 },
  k: 1.3,
  glass: true,
  wave: { edges: { top: [1500, 400], b1: [1880, 770], b2: [2280, 1150], bot: [3000, 1730] }, step: 24, bleed: 40 },
  story: [
    ['piece', 'progress', 40, 620, 470, -4],
    ['medal', 'pat', 240, 2430, 400],
    ['piece', 'check', 2064 + 1500, 1500, 470, 5],
    ['piece', 'food', 4128 + 50, 640, 220, -7, 'leaf'],
    ['piece', 'food', 4128 + 250, 770, 200, 6, 'loaf'],
    ['piece', 'food', 4128 + 80, 920, 200, -3, 'cup'],
    ['medal', 'doc', 6192 + 1760, 1700, 380],
    ['piece', 'steps', 8256 + 50, 600, 430, -4],
    ['medal', 'pat', 8256 + 1800, 2470, 380],
  ],
  beads: [[2064 + 1900, 2000, 70], [2064 + 1990, 2110, 36], [6192 + 1880, 1240, 64], [8256 + 120, 1500, 56]],
};

const Q = new URLSearchParams(location.search);
const TARGET = Q.get('target') || 'ios', LANG = Q.get('lang') || 'en';
const CONFIG = CONFIGS[TARGET], T = TEXT[LANG];
if (!CONFIG) throw new Error('unknown target ' + TARGET);
if (!T) throw new Error('no text for language ' + LANG);

/* ---------------- derived sizes ---------------- */
// ?shots=[…] replaces the device list (for trying positions quickly with --dump-dom)
if (Q.get('shots')) CONFIG.shots = JSON.parse(Q.get('shots'));
const C = CONFIG, N_SHOTS = C.shots.length, H = C.shotH;
const GAP = C.gap || 0, PITCH = C.shotW + GAP;            // screenshot i starts at x = i × PITCH
const W = N_SHOTS * C.shotW + (N_SHOTS - 1) * GAP;        // canvas, gaps included
// story x written as (shot × shotW + x in shot) → canvas x
const gx = x => x + Math.min(N_SHOTS - 1, Math.max(0, Math.floor(x / C.shotW))) * GAP;
const F = C.frame;
// glass: the config's flag; ?glass=0 / ?glass=1 overrides it (for comparing)
const GLASS = (Q.get('glass') ?? (C.glass ? '1' : '0')) !== '0';
// iLARS tints: deep indigo rims, violet shadows, a faint lilac in the frost
if (GLASS) Glass.on({ ink: '42, 27, 85', tint: '96, 58, 200', frost: '250, 247, 255' });
if (Q.get('nohl')) document.body.classList.add('nohl');
const root = document.documentElement;
Object.entries(F.drawn
    ? { W, H, shotW: C.shotW, k: C.k }
    : { W, H, shotW: C.shotW, fw: F.w, fh: F.h, sx: F.sx, sy: F.sy, sw: F.sw, sh: F.sh, sr: F.r, k: C.k })
  .forEach(([k, v]) => root.style.setProperty('--' + k, v));
document.body.dataset.strip = `${C.shotW}x${C.shotH}x${N_SHOTS}x${GAP}`;
const screenSrc = i => `../raw/${C.captures}${LANG}/${T.screens[i]}.png`;
const CAP = F.drawn ? [F.capW, F.capH] : [F.sw, F.sh];     // capture size in pixels
{ const s = document.querySelector('#ps'), l = document.querySelector('#ls'), k = C.k;   // wave shadows follow the scale
  s.setAttribute('dy', 12 * k); s.setAttribute('stdDeviation', 14 * k); l.setAttribute('dy', -6 * k); l.setAttribute('stdDeviation', 9 * k); }

/* ---------------- devices ---------------- */
const phoneH = w => {
  if (!F.drawn) return w * F.h / F.w;
  const sw = w - 2 * F.bezel;
  return sw * (F.capH - F.cropTop) / F.capW + 2 * F.bezel;
};
// a capture pixel (px, py) → canvas pixels, for device i
function capToPage(i, px, py) {
  const s = C.shots[i], w = s.w, h = phoneH(w);
  let x, y;
  if (F.drawn) { const sc = (w - 2 * F.bezel) / F.capW; x = F.bezel + px * sc; y = F.bezel + (py - F.cropTop) * sc; }
  else { const sc = w / F.w; x = (F.sx + px) * sc; y = (F.sy + py) * sc; }
  x -= w / 2; y -= h / 2;
  const a = s.angle * Math.PI / 180, c = Math.cos(a), si = Math.sin(a);
  return [i * PITCH + s.cx + x * c - y * si, s.cy + x * si + y * c];
}
// the four corners of the device's body outline (rounded corners taken as sharp), canvas pixels
// (TL, TR, BR, BL). Apple's frame pictures have a transparent margin around the body (F.body).
function phoneCorners(s, i) {
  const w = s.w, h = phoneH(w), a = s.angle * Math.PI / 180, c = Math.cos(a), si = Math.sin(a);
  const cx = i * PITCH + s.cx, cy = s.cy;
  const hw = F.body ? (w / 2) * (F.body.w / F.w) : w / 2, hh = F.body ? (h / 2) * (F.body.h / F.h) : h / 2;
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]
    .map(([x, y]) => [cx + x * c - y * si, cy + x * si + y * c]);
}
const shotsEl = document.getElementById('shots');
C.shots.forEach((s, i) => {
  const box = document.createElement('div');
  box.className = 'shot';
  box.style.left = (i * PITCH) + 'px';
  box.style.zIndex = s.z || 0;
  const w = s.w, h = phoneH(w), left = s.cx - w / 2, top = s.cy - h / 2;
  const place = `left:${left}px; top:${top}px; transform: rotate(${s.angle}deg)`;
  if (F.drawn) {
    const b = F.bezel, sw = w - 2 * b, sh = h - 2 * b, imgH = sw * F.capH / F.capW, off = F.cropTop * sw / F.capW;
    box.innerHTML = `<div class="tilt" style="--dz:${C.k}"><div class="phone drawn" style="width:${w}px; height:${h}px; ${place}; ` +
      `border-radius:${F.radius + b}px; --dz:${C.k}">` +
      `<div class="dscreen" style="left:${b}px; top:${b}px; width:${sw}px; height:${sh}px; border-radius:${F.radius}px">` +
      `<img src="${screenSrc(i)}" style="width:${sw}px; height:${imgH}px; top:${-off}px"></div></div></div>`;
  } else {
    box.innerHTML = `<div class="tilt" style="--dz:${C.k}"><div class="phone" style="--w:${w}px; ${place}">` +
      `<img class="screen" src="${screenSrc(i)}"><img class="sbar" src="${F.statusbar}">` +
      `<img class="frame" src="${F.src}"></div></div>`;
  }
  shotsEl.appendChild(box);
});

/* ---------------- the wave ----------------
   A periodic cosine: low at the centre of shots 1, 3, 5, high at 2, 4; every edge crosses the
   middle of each gap at (low + high) / 2. Drawn in canvas x, gaps included. */
const hump = x => (1 + Math.cos(2 * Math.PI * (x - (PITCH + C.shotW / 2)) / (2 * PITCH))) / 2;
const E = {};
for (const [k, [lo, hi]] of Object.entries(C.wave.edges)) E[k] = x => lo + (hi - lo) * hump(x);
function band(fTop, fBot) {
  const pts = [], { step, bleed } = C.wave;
  for (let x = -bleed; x <= W + bleed; x += step) pts.push([x, fTop(x)]);
  for (let x = W + bleed; x >= -bleed; x -= step) pts.push([x, fBot(x)]);
  return 'M' + pts.map(p => p[0] + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
}
const arch = document.getElementById('arch');
arch.setAttribute('width', W); arch.setAttribute('height', H); arch.setAttribute('viewBox', `0 0 ${W} ${H}`);
document.getElementById('arA').setAttribute('d', band(E.top, E.bot));
document.getElementById('arB').setAttribute('d', band(E.b1, E.bot));
document.getElementById('arC').setAttribute('d', band(E.b2, E.bot));
if (GLASS) {
  Glass.wave(arch, [['arA', E.top], ['arB', E.b1], ['arC', E.b2]].map(([id, edge]) => ({ path: document.getElementById(id), edge })),
    -C.wave.bleed, W + C.wave.bleed, C.k, C.wave.step);
  Glass.medalRims(['doc', 'pat']);
}

/* ---------------- story pieces ---------------- */
const story = document.getElementById('story');
C.story.forEach(([kind, ...a]) => {
  if (kind === 'medal') { const [who, cx, ...rest] = a; ilarsMedal(story, who, gx(cx), ...rest); }
  else if (kind === 'piece') {
    const [k, x, ...rest] = a, e = ilarsPiece(story, k, gx(x), ...rest);
    // a glass piece that lies over a device's black edge gets more frost (as Dr. Filler's window):
    // the edge would otherwise show through as a grey smudge
    if (GLASS) {
      const r = e.getBoundingClientRect(), polys = C.shots.map(phoneCorners);
      const inPoly = (p, [px, py]) => [0, 1, 2, 3].every(j => { const [x1, y1] = p[j], [x2, y2] = p[(j + 1) % 4];
        return (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1) >= 0; });
      const pts = []; for (let u = 0; u <= 1; u += .1) for (let v = 0; v <= 1; v += .1) pts.push([r.left + u * r.width, r.top + v * r.height]);
      if (polys.some(p => pts.some(q => inPoly(p, q)))) {
        e.style.setProperty('--frost', .88);
        // and a quieter bend at the rim: a strongly bent black edge reads as a smudge, not as glass
        const id = (e.style.backdropFilter.match(/url\(["']?#([\w-]+)/) || [])[1];
        const dm = id && document.getElementById(id)?.querySelector('feDisplacementMap');
        if (dm) dm.setAttribute('scale', dm.getAttribute('scale') * .3);
      }
    }
  }
});
const beadEls = GLASS ? (C.beads || []).map(([x, y, d]) => Glass.bead(story, gx(x), y, d)) : [];

/* ---------------- headlines ---------------- */
const hlBox = document.getElementById('headlines');
T.headlines.forEach(([l1, l2], i) => {
  const d = document.createElement('div');
  d.className = 'hl'; d.dataset.shot = i;
  d.innerHTML = `<span class="l"><span></span></span><span class="l l2"><span></span></span>`;
  d.querySelectorAll('.l > span')[0].textContent = l1;
  d.querySelectorAll('.l > span')[1].textContent = l2;
  hlBox.appendChild(d);
});

/* one size for all shots, the largest at which every line fits */
document.fonts.ready.then(() => {
  const hls = [...document.querySelectorAll('.hl')];
  hls.forEach(h => { h.style.left = (+h.dataset.shot * PITCH) + 'px'; h.style.width = C.shotW + 'px'; });
  const spans = [...document.querySelectorAll('.hl .l > span')];
  let size = C.headline.max;
  for (; size > C.headline.min; size -= 1) {
    root.style.setProperty('--hl', size + 'px');
    if (spans.every(s => s.getBoundingClientRect().width <= C.headline.col)) break;
  }
  hls.forEach(h => {
    const pos = C.shots[+h.dataset.shot].pos;
    h.style.top = (pos === 'low' ? C.headline.top : C.headline.bottom) + 'px';
  });
  const nunito = document.fonts.check(`900 ${size}px Nunito`) &&
    [...document.fonts].some(f => f.family.replace(/"/g, '') === 'Nunito' && f.status === 'loaded');
  document.body.dataset.hl = size;
  document.body.dataset.font = nunito ? 'nunito' : 'FALLBACK';

  /* ---- checks (read by `--dump-dom`, data-check) ---- */
  const polys = C.shots.map(phoneCorners);
  const inside = (p, [x, y]) => { let s = 0; for (let k = 0; k < p.length; k++) { const [x1, y1] = p[k], [x2, y2] = p[(k + 1) % p.length];
    const c = (x2 - x1) * (y - y1) - (y2 - y1) * (x - x1); s += c > 0 ? 1 : -1; } return Math.abs(s) === p.length; };
  const distPolyRect = (p, r) => {
    let best = 1e9;
    for (let k = 0; k < 4; k++) { const [x1, y1] = p[k], [x2, y2] = p[(k + 1) % 4];
      for (let t = 0; t <= 1; t += 0.002) { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
        const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
        best = Math.min(best, Math.hypot(dx, dy)); } }
    if ([[r.left, r.top], [r.right, r.top], [r.left, r.bottom], [r.right, r.bottom]].some(q => inside(p, q))) best = -1;
    return Math.round(best);
  };
  // glyph box of each headline line: the span's box trimmed to cap height / descender
  const lines = spans.map((s, j) => { const r = s.getBoundingClientRect(), pad = (r.height - size * 1.0) / 2;
    return { left: r.left, right: r.right, top: r.top + pad, bottom: r.bottom - pad, l2: j % 2 === 1 }; });
  // keep areas as canvas polygons
  const keeps = C.shots.map((s, i) => KEEP[C.keep][T.screens[i]].map(([x1, y1, x2, y2]) =>
    [[x1, y1], [x2, y1], [x2, y2], [x1, y2]].map(([x, y]) => capToPage(i, x, y))));
  const pieces = [...story.children].map(e => e.getBoundingClientRect());
  const guide = document.getElementById('guide');
  guide.setAttribute('width', W); guide.setAttribute('height', H);
  // outer corner radius of the device outline (the straight part of an edge ends this far from a corner)
  const outerR = w => F.drawn ? F.radius + F.bezel : F.body.r * w / F.w;
  /* Seam check for a device that crosses from screenshot i into i + 1: where each straight edge
     leaves screenshot i (x = shotW there) and enters screenshot i + 1 (x = 0 there), in each
     screenshot's own pixels. Shown side by side with the configured gap, the enter point sits
     gap px right of the leave point; `onLine` says the step (dy over gap) equals the edge's own
     slope: the two pieces lie on one straight line. `straight` = both points on the straight part
     of the edge, not on a rounded corner. A corner turned inside the gap: `corner: 'in gap'`. */
  const EDGES = ['top', 'right', 'bottom', 'left'];
  function seamCheck(p, i) {
    const xa = i * PITCH + C.shotW, xb = (i + 1) * PITCH, r = outerR(C.shots[i].w);
    const hits = x => {
      const h = [];
      for (let k = 0; k < 4; k++) {
        const [x1, y1] = p[k], [x2, y2] = p[(k + 1) % 4], t = (x - x1) / (x2 - x1);
        if (t >= 0 && t <= 1) h.push({ k, t, y: y1 + (y2 - y1) * t, len: Math.hypot(x2 - x1, y2 - y1), slope: (y2 - y1) / (x2 - x1) });
      }
      return h.sort((a, b) => a.y - b.y);
    };
    const A = hits(xa), B = hits(xb);
    if (A.length !== 2 || B.length !== 2) return [{ error: `outline crosses the borders ${A.length}/${B.length} times` }];
    const offCorner = h => Math.min(h.t, 1 - h.t) * h.len;
    return [0, 1].map(j => {
      const a = A[j], b = B[j], same = a.k === b.k;
      const o = { side: j ? 'lower' : 'upper', edge: same ? EDGES[a.k] : `${EDGES[a.k]}→${EDGES[b.k]}`,
        leave: [C.shotW, +a.y.toFixed(1)], enter: [0, +b.y.toFixed(1)] };
      if (same) Object.assign(o, { onLine: GAP > 0 ? Math.abs((b.y - a.y) / GAP - a.slope) < 1e-9 : true,
        straight: offCorner(a) >= r && offCorner(b) >= r });
      else o.corner = 'in gap';
      return o;
    });
  }
  const out = { target: TARGET, hl: size, gap: GAP, canvas: [W, H], glass: GLASS, phones: polys.map((p, i) => {
    const xs = p.map(q => q[0]), ys = p.map(q => q[1]), s = C.shots[i];
    const seamL = i * PITCH, seamR = seamL + C.shotW;
    const crossing = i < N_SHOTS - 1 && Math.max(...xs) > (i + 1) * PITCH;
    const intoPrev = i > 0 && Math.min(...xs) < (i - 1) * PITCH + C.shotW;
    let keepMargin = 1e9, keepSide = '', keepCovered = 0, piecesOnKeep = 0;
    keeps[i].forEach(kp => {
      kp.forEach(([x, y]) => { [[x - seamL, 'left'], [seamR - x, 'right'], [y, 'top'], [H - y, 'bottom']]
        .forEach(([m, side]) => { if (m < keepMargin) { keepMargin = m; keepSide = side; } }); });
      for (let u = 0; u <= 1; u += 0.05) for (let v = 0; v <= 1; v += 0.05) {
        const a = kp[0], b = kp[1], d = kp[3];
        const pt = [a[0] + (b[0] - a[0]) * u + (d[0] - a[0]) * v, a[1] + (b[1] - a[1]) * u + (d[1] - a[1]) * v];
        if (polys.some((q, j) => j !== i && (C.shots[j].z || 0) > (s.z || 0) && inside(q, pt))) keepCovered++;
        if (pieces.some(r => pt[0] > r.left && pt[0] < r.right && pt[1] > r.top && pt[1] < r.bottom)) piecesOnKeep++;
      }
      if (Q.get('guide')) guide.insertAdjacentHTML('beforeend',
        `<polygon points="${kp.map(q => q.join(',')).join(' ')}" fill="rgba(255,0,80,.12)" stroke="#ff0050" stroke-width="4"/>`);
    });
    const maxX = Math.max(...xs) - seamL;
    return { i: i + 1, w: s.w, angle: s.angle,
      // share of the device's width that shows in the next screenshot (after the gap); null = last
      cross: i < N_SHOTS - 1 ? +((Math.max(...xs) - (i + 1) * PITCH) / s.w).toFixed(3) : null,
      exit: maxX <= C.shotW ? 'inside' : crossing ? 'crosses' : 'runs off',          // right side
      exitLeft: Math.min(...xs) >= seamL ? 'inside' : intoPrev ? 'shows in the previous one' : 'runs off',
      minX: Math.round(Math.min(...xs) - seamL), maxX: Math.round(maxX),
      top: Math.round(Math.min(...ys)), bottom: Math.round(Math.max(...ys) - H),
      hlGap: Math.min(...lines.map(r => distPolyRect(p, r))),
      keepMargin: Math.round(keepMargin), keepSide, keepCovered, piecesOnKeep, intoPrev,
      seam: crossing ? seamCheck(p, i) : null };
  }) };
  out.seamsOk = out.phones.every(ph => !ph.seam || (ph.seam.length === 2 && ph.seam.every(e => e.onLine || e.corner)));
  out.seamNote = `shown with a ${GAP}px gap, every crossing edge continues on one straight line: ${out.seamsOk}`;
  out.piecesOnHeadline = pieces.filter(r => lines.some(l => r.left < l.right && r.right > l.left && r.top < l.bottom + 40 && r.bottom > l.top - 40)).length;
  // beads: never on a seam (whole bead inside one screenshot), near a headline or on a screen
  out.beads = beadEls.map(e => { const r = e.getBoundingClientRect(), i = Math.floor(r.left / PITCH);
    const inShot = r.left >= i * PITCH + 20 && r.right <= i * PITCH + C.shotW - 20;
    const onDevice = polys.some(p => [[r.left, r.top], [r.right, r.top], [r.left, r.bottom], [r.right, r.bottom]].some(q => inside(p, q)));
    const nearHl = lines.some(l => r.left < l.right + 60 && r.right > l.left - 60 && r.top < l.bottom + 60 && r.bottom > l.top - 60);
    return { shot: i + 1, ok: inShot && !onDevice && !nearHl, inShot, onDevice, nearHl }; });
  // headline line boxes in each screenshot's own pixels (for the contrast check in render.sh)
  out.lines = lines.map(l => { const i = Math.floor(l.left / PITCH);
    return [i + 1, l.l2 ? 2 : 1, Math.round(l.left - i * PITCH), Math.round(l.top), Math.round(l.right - i * PITCH), Math.round(l.bottom)]; });
  document.body.dataset.check = JSON.stringify(out);
  document.title = `hl=${size} font=${document.body.dataset.font} strip=${document.body.dataset.strip}`;
});
</script>
</body>
</html>
